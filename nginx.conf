server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Si la ruta no existe como archivo, se entrega index.html para que
    # Angular resuelva la ruta y al recargar la página no salga error 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
